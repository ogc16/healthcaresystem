name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A rapid series of pushes to the same ref should not queue up four full builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only ever needs to read the repository.
permissions:
  contents: read

jobs:
  # Static verification: catches type, lint and coverage-floor regressions
  # fast and independently from the slower e2e and image jobs.
  static-checks:
    name: typecheck, lint, unit, coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 is past end-of-life. This is the oldest runtime that still
          # satisfies everything the dependency tree asks for: Sentry needs
          # >=20.19 and vite (via vitest) needs @types/node >=22.12.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit tests with the code-coverage floor enforced. The thresholds live
      # in vitest.config.mts and are the measured baseline from the CI/CD
      # hardening slice; a dip below them fails the build.
      - name: Unit tests and coverage floor
        run: npm run test:coverage

  # E2E against the mock Appwrite server; Chromium ships inside the action.
  e2e:
    name: end-to-end (mock appwrite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is bundled with Playwright; the mock Appwrite server and the
      # Next dev server are started by the Playwright config's webServer.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test

  # Filesystem vulnerability scan over the dependency manifest; no install is
  # needed because the lockfile names the whole tree. Blocks on HIGH/CRITICAL
  # except for what .trivyignore documents (the unfixable tailwindcss@3
  # toolchain advisories).
  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: library

  # The production build gate lives here: Docker builds the standalone image
  # (which runs `next build`), and Trivy then verifies the shipped artifacts —
  # base OS packages and the traced dependencies — carry no HIGH/CRITICAL
  # findings. Logged vulnerabilities are legitimate signal, not noise from a
  # dev-only dependency tree.
  docker-image:
    name: docker build + trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t healthcaresystem:ci .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: healthcaresystem:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

  # Dependency scan of the production tree via npm audit. Informational and
  # non-blocking: high-severity advisories in the tailwindcss@3 toolchain
  # (braces, micromatch, postcss-selector-parser) have no fix short of a
  # breaking upgrade to tailwindcss@4 (`npm audit fix --force`). Run `npm run
  # audit` locally to review the full report.
  dependency-scan:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit
        continue-on-error: true