name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A rapid series of pushes to the same ref should not queue up four full builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only ever needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 is past end-of-life. This is the oldest runtime that still
          # satisfies everything the dependency tree asks for: Sentry needs
          # >=20.19 and vite (via vitest) needs @types/node >=22.12.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No Appwrite variables are set. Client construction in
      # src/lib/appwrite.config.ts is deferred to first use and fails loudly by
      # name, so a build that never calls the API needs no real credentials.
      # SENTRY_AUTH_TOKEN is deliberately absent too: with no token the
      # source-map upload is skipped instead of failing the build.
      - name: Disable Sentry telemetry
        run: echo "SENTRY_TELEMETRY=false" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Unit tests with the code-coverage floor enforced. The thresholds live
      # in vitest.config.mts and are the measured baseline from the CI/CD
      # hardening slice; a dip below them fails the build.
      - name: Unit tests and coverage floor
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Dependency scan (informational, non-blocking) and Playwright tests run on
  # their own jobs so a scanner finding never holds up the build.
  dependency-scan:
    name: dependency scan (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # High-severity advisories in the tailwindcss@3 toolchain (braces,
      # micromatch, postcss-selector-parser) currently have no fix short of a
      # breaking upgrade to tailwindcss@4 (`npm audit fix --force`). This step
      # stays informational until that upgrade is done; run `npm run audit`
      # locally to review the full report.
      - name: Audit production dependencies
        run: npm run audit
        continue-on-error: true

  e2e:
    name: end-to-end (mock appwrite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is bundled with Playwright; the mock Appwrite server and the
      # Next dev server are started by the Playwright config's webServer.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test